name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dev)
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -var-file=envs/dev.tfvars 2>&1 | tee /tmp/tf-plan.txt

      - name: Post Plan to Step Summary
        if: always()
        run: |
          echo "## Terraform Plan — dev environment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tf-plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply (dev)
        env:
          TF_VAR_run_seed: ${{ github.run_number }}
          TF_VAR_grafana_url: ${{ secrets.GRAFANA_URL }}
          TF_VAR_grafana_service_account_token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_grafana_folder_uid: ${{ secrets.GRAFANA_FOLDER_UID }}
        run: terraform apply -auto-approve -input=false -var-file=envs/dev.tfvars

      - name: Push Dashboard to Grafana Cloud
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_FOLDER_UID: ${{ secrets.GRAFANA_FOLDER_UID }}
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_TOKEN" ]; then
            echo "GRAFANA_URL or GRAFANA_SERVICE_ACCOUNT_TOKEN secret not set — skipping dashboard push"
            echo "See README for setup instructions."
            exit 0
          fi

          # Strip accidental trailing slash from GRAFANA_URL
          GRAFANA_URL="${GRAFANA_URL%/}"

          # Discover the TestData datasource UID in this Grafana instance.
          # In Grafana Cloud the UID is an auto-generated GUID, not the
          # provisioning default "grafana-testdata-datasource", so we must
          # look it up. If no TestData datasource exists we create one with
          # the exact UID our dashboard JSON already references.
          echo "Discovering TestData datasource UID..."
          DS_UID=$(curl -s \
            -H "Authorization: Bearer ${GRAFANA_TOKEN}" \
            "${GRAFANA_URL}/api/datasources" | \
            jq -r '.[] | select(.type == "testdata") | .uid' | head -1)

          if [ -z "$DS_UID" ]; then
            echo "TestData datasource not found — creating with uid grafana-testdata-datasource"
            CREATE_RESP=$(curl -sS -X POST \
              -H "Authorization: Bearer ${GRAFANA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"TestData DB","type":"testdata","uid":"grafana-testdata-datasource","access":"proxy"}' \
              "${GRAFANA_URL}/api/datasources")
            DS_UID=$(echo "$CREATE_RESP" | jq -r '.datasource.uid // .uid // "grafana-testdata-datasource"')
            echo "Created TestData datasource — assigned UID: ${DS_UID}"
          else
            echo "Found TestData datasource — UID: ${DS_UID}"
          fi

          # Substitute the actual UID into the dashboard JSON when it differs
          # from the compile-time placeholder written by Terraform.
          if [ "$DS_UID" != "grafana-testdata-datasource" ]; then
            echo "Patching dashboard JSON: grafana-testdata-datasource -> ${DS_UID}"
            sed -i "s/grafana-testdata-datasource/${DS_UID}/g" grafana-dashboard.generated.json
          fi

          PAYLOAD=$(jq -n \
            --argjson dash "$(cat grafana-dashboard.generated.json)" \
            --arg folder_uid "${GRAFANA_FOLDER_UID:-}" \
            --arg msg "CI run #$GITHUB_RUN_NUMBER" \
            '{
              dashboard: $dash,
              overwrite: true,
              folderUid: ($folder_uid | if . == "" then null else . end),
              message: $msg
            }')
          echo "Pushing dashboard to ${GRAFANA_URL}/api/dashboards/db ..."
          HTTP_STATUS=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GRAFANA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GRAFANA_URL}/api/dashboards/db" \
            -o /tmp/grafana-response.json \
            -w "%{http_code}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response body:"
          cat /tmp/grafana-response.json
          echo ""
          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "ERROR: Grafana API returned HTTP ${HTTP_STATUS} — check GRAFANA_URL and GRAFANA_SERVICE_ACCOUNT_TOKEN secrets"
            exit 1
          fi
          echo "Dashboard pushed successfully — refresh Grafana to see updated metrics"

      - name: Upload Grafana Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboard-dev
          path: grafana-dashboard.generated.json
